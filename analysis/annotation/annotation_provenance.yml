pipeline:
  branch: redesign
  scope: 87-item human pilot
  status: prepared_blank_not_annotated
  updated_at: "2026-09-01"
  scripts:
    - scripts/annotation/01_sample.py
    - scripts/annotation/02_make_sheets.py
    - scripts/annotation/03_reliability.R
    - scripts/R/krippendorff.R

codebook:
  path: docs/annotation/PILOT_CODEBOOK.md
  version: "0.2-pre-pilot"
  axes:
    function: [Background, Motivation, Uses, Extends, CompareContrast, Future]
    stance: [Negative, Neutral, Positive]
    depth: [Perfunctory, Substantive]
  reliability_thresholds:
    firm: 0.80
    tentative_minimum: 0.667

input:
  contexts_combined_csv: analysis/corpus_production/contexts_combined.csv
  input_hash_sha256_16: fd5241e1adedb385
  total_combined_rows: 399
  annotation_eligible_rows: 87
  eligible_citing_works: 69
  eligibility_contract:
    - context_window_complete is true
    - context_sentence_count equals 3
    - sentence_before, citing_sentence, and sentence_after are non-empty
    - context_quality_flags is empty
    - S2-only pre-computed snippets are ineligible

sampler:
  env_defaults:
    ANNOT_N_TOTAL: 100
    ANNOT_PER_SEED: 33
    ANNOT_SEED: 20260625
    ANNOT_OVERSAMPLE_NON_ARTICLE: 1
    ANNOT_REQUIRE_COMPLETE_WINDOW: 1
    ANNOT_GLOBAL_FILL: 1
  realized_total_items: 87
  pilot_sample_hash_sha256_16: d51cd33c0e344892
  note: >
    The quality-gated eligible pool contains 87 rows, so global fill exhausts
    it. The pilot is for codebook and reliability testing, not prevalence.
  realized_per_seed:
    meadows_1972_limits_to_growth: 48
    commoner_1971_closing_circle: 17
    schumacher_1974_small_is_beautiful: 22
  realized_per_band:
    pre2000: 29
    2000s: 13
    2010onward: 45

sheets:
  annotators: [A, B]
  paths:
    - analysis/annotation/sheets/annotator_A.csv
    - analysis/annotation/sheets/annotator_B.csv
  rows_per_sheet: 87
  visible_columns:
    - item_id
    - seed
    - citing_year
    - work_type
    - sentence_before
    - citing_sentence
    - sentence_after
    - context
  blank_label_columns: [function, stance, depth, flag, notes]
  quarantine_verified: true
  real_labels_present: false

reliability:
  status: tooling_tested_waiting_for_human_sheets
  synthetic_fixture_dir: analysis/annotation/fixtures
  real_report: analysis/annotation/reliability_report.md
  real_disagreements: analysis/annotation/disagreements.csv
  real_outputs_present: false
